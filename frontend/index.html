<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="description" content="Imagine a VTuber in real life, or turn your photo into a VTuber character.">
    <title>Oshified</title>
    <link rel="stylesheet" href="/oshified.css">
</head>
<body class="is-landing">
<main class="oshified-shell">
    <header class="app-heading">
        <a href="/" id="back-home" class="back-home" hidden>← Home</a>
        <h1 class="wordmark"><a href="/">OSHIFIED</a></h1>
        <span class="mode-badge" id="mode-badge" hidden></span>
    </header>
    <nav id="modes" class="mode-picker" aria-label="Transformations">
        <a class="mode-card" href="?mode=vtuber-to-real">
            <span class="mode-card-content"><strong>Meet your oshi IRL</strong><span>Bridge the gap between 2D and 3D</span></span>
        </a>
        <a class="mode-card" href="?mode=real-to-vtuber">
            <span class="mode-card-content"><strong>Join your oshi</strong><span>Live in the same world as your favorites</span></span>
        </a>
    </nav>

    <form id="generation" hidden>
        <p id="step-position" class="step-position" aria-live="polite"></p>
        <fieldset data-step="0">
            <legend>Upload image</legend>
            <p id="image-description" class="hint"></p>
            <label class="upload-field">
                <span>Choose image</span>
                <input id="image" name="image" type="file" accept="image/jpeg,image/png,image/webp" aria-describedby="image-description" required>
            </label>
            <section class="presets" id="image-presets" aria-label="Image examples" hidden></section>
            <div class="image-selection" id="image-selection" hidden>
                <img id="image-preview" class="portrait" alt="Selected image preview" hidden>
                <button id="clear-image" type="button" class="quiet-button">Remove image</button>
            </div>
        </fieldset>
        <fieldset data-step="1" hidden>
            <legend>Upload audio</legend>
            <label for="video-url">YouTube link</label>
            <input id="video-url" name="video_url" type="url" placeholder="https://www.youtube.com/watch?v=…" aria-describedby="audio-description">
            <label class="upload-field">
                <span>Or upload an audio file</span>
                <input id="audio" name="audio" type="file" accept="audio/mpeg,audio/wav,audio/x-wav,audio/mp4,audio/ogg,audio/webm" aria-describedby="audio-description">
            </label>
            <section class="presets" id="audio-presets" aria-label="Audio examples" hidden></section>
            <div class="audio-selection" id="audio-selection" hidden>
                <audio id="audio-preview" controls preload="metadata" hidden></audio>
                <button id="clear-audio" type="button" class="quiet-button">Remove audio file</button>
            </div>
            <p id="audio-description" class="hint">The first 20 seconds drive the animation.</p>
        </fieldset>
        <fieldset data-step="2" hidden>
            <legend>Choose a portrait option</legend>
            <div class="options">
                <label><input type="radio" name="variant" value="female" checked><span>Female</span></label>
                <label><input type="radio" name="variant" value="male"><span>Male</span></label>
            </div>
            <div id="challenge"></div>
        </fieldset>
        <div class="wizard-controls">
            <button id="previous" type="button" hidden>← Previous</button>
            <button id="next" type="button">Next step →</button>
            <button id="submit" type="submit" hidden>Generate →</button>
        </div>
    </form>

    <p id="notice" class="notice" role="alert" hidden></p>
    <section class="result-notification" aria-label="Generation progress">
        <p id="job-status" role="status" aria-live="polite" hidden></p>
    </section>
    <section id="results" class="results" aria-label="Results" hidden>
        <article id="before-result" hidden>
            <h2 id="before-label">Before</h2>
            <img id="before" class="portrait" alt="Original image">
        </article>
        <article id="still-result" hidden>
            <h2 id="still-label">Portrait</h2>
            <img id="still" class="portrait" alt="Generated portrait">
            <a id="download-still" class="download">Download portrait</a>
        </article>
        <article id="clip-result" hidden>
            <h2>Animated</h2>
            <video id="clip" controls playsinline preload="metadata"></video>
            <div class="result-actions">
                <a id="download-clip" class="download">Download clip</a>
                <button id="share" type="button">Share clip</button>
            </div>
            <label id="share-fallback" class="share-fallback" hidden>
                <span>Share link</span>
                <input id="share-link" type="url" readonly>
            </label>
        </article>
    </section>
    <div class="result-actions">
        <button id="retry-clip" type="button" hidden>Retry animation</button>
        <button id="start-over" type="button" hidden>Start over</button>
    </div>
    <footer class="source-footer" hidden><a id="source-code">Source code</a></footer>
</main>
<dialog id="mode-note" aria-labelledby="mode-note-title">
    <form method="dialog">
        <h2 id="mode-note-title"></h2>
        <p id="mode-note-description"></p>
        <button type="submit">Continue →</button>
    </form>
</dialog>
<script type="module" src="/js/oshified.js"></script>
</body>
</html>
